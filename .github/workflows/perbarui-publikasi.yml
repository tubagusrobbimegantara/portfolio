name: Perbarui publikasi

# Menarik daftar karya dan jumlah sitasi dari OpenAlex + ORCID setiap hari.
# Kalau ada perubahan, hasilnya di-commit sehingga Cloudflare membangun ulang
# situsnya sendiri. Kalau tidak ada perubahan, tidak ada commit sama sekali.

on:
  schedule:
    - cron: "17 21 * * *" # 21.17 UTC = 04.17 WIB
  workflow_dispatch: # bisa juga dijalankan manual dari tab Actions

permissions:
  contents: write

concurrency:
  group: perbarui-publikasi
  cancel-in-progress: false

jobs:
  perbarui:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil repositori
        uses: actions/checkout@v5

      - name: Siapkan Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Tarik data terbaru
        run: node scripts/perbarui-publikasi.mjs

      - name: Commit bila ada perubahan
        run: |
          if [ -z "$(git status --porcelain src/data/publikasi-otomatis.json)" ]; then
            echo "Tidak ada perubahan data — tidak ada yang di-commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/publikasi-otomatis.json
          git commit -m "Perbarui daftar publikasi dari OpenAlex dan ORCID"
          git push
